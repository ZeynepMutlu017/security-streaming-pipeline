services:
  # ---------- Spark + Jupyter (image from Veri Bilimi Okulu bootcamp, week 10) ----------
  spark:
    image: veribilimiokulu/pyspark:4.1.4_python-3.12_java21
    container_name: spark
    deploy:
      resources:
        limits:
          memory: "3g"
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark UI
    networks:
      - secnet
    volumes:
      - ./data:/opt/project/data
      - ./notebooks:/opt/project/notebooks
      - ./spark_jobs:/opt/project/spark_jobs
    working_dir: /opt/project
    command:
      - /bin/bash
      - -c
      - |
        pip install -q jupyterlab && \
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root \
          --ServerApp.token='' --ServerApp.root_dir=/opt/project

  # ---------- Kafka (single broker, KRaft) ----------
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    deploy:
      resources:
        limits:
          memory: "1g"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: other containers (kafka:29092) | HOST: your computer (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    networks:
      - secnet
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------- Elasticsearch + Kibana ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: elasticsearch
    deploy:
      resources:
        limits:
          memory: "2g"
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false     # local development only
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    networks:
      - secnet
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.0   # must match the Elasticsearch version
    container_name: kibana
    deploy:
      resources:
        limits:
          memory: "1g"
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - secnet
    depends_on:
      - elasticsearch

volumes:
  kafka_data:
  es_data:

networks:
  secnet: